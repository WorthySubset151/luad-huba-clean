[project]
name = "luad-huba"
version = "0.1.0"
description = "Pipeline przygotowania danych RNA-seq i klinicznych TCGA-LUAD dla modeli predykcji przeżywalności"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "loguru>=0.7",
    "polars>=0.20",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "streamlit>=1.35",
    "plotly>=5.20",
    "lifelines>=0.28",
    "scikit-survival>=0.22",
    "scipy>=1.13",
    "numpy>=1.26",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
luad-huba = "src.cli:app"
ingest-sample-sheet = "src.ingest.sample_sheet_ingestion:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
